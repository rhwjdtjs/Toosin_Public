name: 💡 기능 제안
description: 새로운 기능이나 개선사항을 제안해주세요
title: "[제안] "
labels: ["💡 제안"]
body:
  - type: textarea
    id: feature
    attributes:
      label: 어떤 기능인가요?
      description: 제안하시는 기능에 대해 설명해주세요
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 왜 필요한가요?
      description: 이 기능이 게임에 어떤 도움이 되나요?
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: 참고 자료 (선택)
      description: 비슷한 게임이나 레퍼런스가 있다면 공유해주세요
