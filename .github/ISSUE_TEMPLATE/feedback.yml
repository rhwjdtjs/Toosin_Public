name: "💡 Feedback & Suggestions (English/한국어)"
description: "Share your ideas or feedback to improve the game. / 게임 개선을 위한 제안이나 피드백을 들려주세요."
title: "[Feedback]: "
labels: ["feedback", "improvement"]
body:
  - type: markdown
    attributes:
      value: |
        We love to hear from our players! / 유저분들의 소중한 의견을 기다립니다.
  - type: textarea
    id: feedback
    attributes:
      label: "✨ Your Feedback / 제안 및 피드백"
      description: "What would you like to see or improve? / 어떤 점을 개선하거나 추가하면 좋을까요?"
      placeholder: "e.g., I think the parrying window is too tight. / 예: 패링 판정이 너무 빡빡한 것 같아요."
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: "📈 Expected Impact / 기대 효과"
      description: "How will this change help the game? / 이 변경이 게임에 어떤 도움이 될까요?"
