name: ⚖️ 밸런스 피드백
description: 난이도, 데미지, 스태미나 등 밸런스 관련 의견을 들려주세요
title: "[밸런스] "
labels: ["⚖️ 밸런스"]
body:
  - type: textarea
    id: issue
    attributes:
      label: 어떤 부분이 불균형한가요?
      description: 너무 쉽거나 어렵거나, 특정 기술이 너무 강하거나 약한 부분을 알려주세요
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 어떻게 조정하면 좋을까요?
      description: 개선 방향에 대한 의견이 있다면 알려주세요
  - type: input
    id: stage
    attributes:
      label: 도달한 스테이지
      placeholder: "예: Stage 5"
